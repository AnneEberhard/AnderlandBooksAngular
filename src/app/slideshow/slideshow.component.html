<div class="slideshowContainer">
  @if (showImage) {
    <img  class="slideshowImage" src="{{images[currentImage]}}">
  }
</div>
<div (click)="navigateHome()" id="enterText" class="" translate>Find your next story!</div>
<div class="slideshowContainer slideshowOverlay" (click)="navigateHome()">
  @if (showImage) {
    <p class="fadeIn" translate>
      {{headlines[currentHeadline]}}
    </p>
  }
</div>
